<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة الإدارة | البصمة</title>
<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:#eef2fa;margin:0;padding:16px;color:#1b2440}
.wrap{max-width:560px;margin:0 auto}
.box{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(40,60,120,.1)}
h1{font-size:20px;margin:0 0 10px} h2{font-size:17px;margin:0 0 8px}
label{display:block;margin-top:10px;font-weight:700;font-size:14px}
input,select,button{width:100%;padding:11px;margin-top:5px;border-radius:12px;border:1.5px solid #d6dcec;font-size:16px;font-family:inherit}
button{background:#16264d;color:#fff;border:0;font-weight:800;cursor:pointer}
button.alt{background:#eef1f7;color:#16264d}
button.sm{width:auto;padding:6px 12px;font-size:14px;margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.tabs button{flex:1 1 30%;margin:0;padding:10px 2px;font-size:14px;background:#fff;color:#7a8299}.tabs button.on{background:#16264d;color:#fff}
.code{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border-radius:12px;background:#eafaf0;margin-top:8px;font-weight:900;direction:ltr}
.row{padding:10px 0;border-bottom:1px solid #eef0f5;font-size:14px}
.row b{direction:ltr;unicode-bidi:isolate}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:800;margin-inline-start:6px}
.used{background:#fde8e8;color:#b42318}.free{background:#e3f6e6;color:#22803a}
.err{color:#c0392b;font-weight:700;margin-top:8px}
.hide{display:none}
a.wa{display:block;text-align:center;text-decoration:none;background:#22803a;color:#fff;border-radius:12px;padding:11px;margin-top:8px;font-weight:800}
.dark{color-scheme:dark}.dark body{background:#0e1430;color:#e8edf8}
.dark .box{background:#1b2447;box-shadow:none}
.dark input,.dark select{background:#141b3a;color:#e8edf8;border-color:#33406b}
.dark input::placeholder{color:#8c97b8}
.dark button{background:#3158c9;color:#fff}
.dark button.alt{background:#26324f;color:#e8edf8}
.dark .tabs button{background:#1b2447;color:#9aa6c6}.dark .tabs button.on{background:#3158c9;color:#fff}
.dark .code{background:#1c3f22;color:#c9f5d4}
.dark .row{border-color:#2a3558}
.dark .used{background:#4a1f1f;color:#ffb4a9}.dark .free{background:#1c3f22;color:#8be0a0}
.dark .err{color:#ff9d92}
.dark [style*="color:#7a8299"]{color:#9aa6c6!important}
.dark [style*="color:#22803a"]{color:#7ee0a1!important}
.dark [style*="background:#eef2fa"]{background:#26324f!important}
.dark [style*="background:#f4f6fb"]{background:#141b3a!important}
.dark a.wa,.dark [style*="background:#22803a"]{background:#1f8f4a!important;color:#fff!important}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
  <h1>لوحة الإدارة — البصمة</h1>

  <div id="loginBox" class="box">
    <h2>دخول الأدمن</h2>
    <label>اسم المستخدم</label><input id="ph" dir="ltr" autocapitalize="none" placeholder="اسم المستخدم">
    <label>الباسورد</label><input id="pw" type="password" dir="ltr">
    <label style="display:flex;align-items:center;gap:6px;font-weight:700;cursor:pointer"><input type="checkbox" style="width:auto;margin:0" onchange="document.getElementById('pw').type=this.checked?'text':'password'"> إظهار الباسورد</label>
    <button onclick="login()" style="margin-top:12px">دخول</button>
    <div id="lerr" class="err"></div>
  </div>

  <div id="main" class="hide">
    <div class="tabs">
      <button id="t-ord" class="on" onclick="tab('ord')">الطلبات <span id="ordN"></span></button>
      <button id="t-pri" onclick="tab('pri')">الأسعار</button>
      <button id="t-act" onclick="tab('act')">تفعيل مباشر</button>
      <button id="t-gen" onclick="tab('gen')">أكواد</button>
      <button id="t-codes" onclick="tab('codes')">الأكواد</button>
      <button id="t-stu" onclick="tab('stu')">الطلبة</button>
    </div>

    <div id="p-ord" class="box"><h2>طلبات الاشتراك الجديدة</h2><div id="olist">جاري التحميل…</div>
      <button class="alt" onclick="loadOrders()" style="margin-top:10px">تحديث 🔄</button>
      <h2 style="margin-top:18px">آخر الطلبات المنتهية</h2><div id="odone"></div></div>

    <div id="p-pri" class="box hide"><h2>أسعار المواد (للترم كامل)</h2>
      <p style="font-size:13px;color:#7a8299;margin:0 0 8px">اكتب سعر كل مادة في كل صف بالجنيه. الخانة الفاضية = المادة دي مش متاحة للصف ده ومش هتظهر للطالب.</p>
      <label>تاريخ نهاية الترم (اختياري، الاشتراك بينتهي بعده)</label>
      <input id="termEnd" type="date">
      <div id="pgrid" style="margin-top:10px"></div>
      <button onclick="savePrices()" style="margin-top:12px">حفظ الأسعار ✅</button>
      <div id="perr" class="err"></div><div id="pok" style="font-weight:800;color:#22803a;margin-top:8px"></div></div>

    <div id="p-act" class="box hide">
      <h2>تفعيل اشتراك لطالب</h2>
      <label>اسم مستخدم الطالب (اللي سجّل بيه)</label>
      <input id="aphone" dir="ltr" autocapitalize="none" placeholder="اسم المستخدم">
      <button class="alt" onclick="findStu()" style="margin-top:10px">بحث عن الطالب</button>
      <div id="aerr" class="err"></div>
      <div id="astu" class="hide">
        <div class="code" style="direction:rtl;flex-direction:column;align-items:flex-start;font-weight:700" id="ainfo"></div>
        <label>الباقة</label>
        <select id="apkg">
          <option value="term">باقة الترم كامل</option>
          <option value="phys">مراجعة الفيزياء</option>
          <option value="math">الرياضيات</option>
          <option value="arab">ملخصات العربي</option>
        </select>
        <button onclick="act()" style="margin-top:12px">فعّل الباقة</button>
        <button class="alt" onclick="rev()" style="margin-top:8px">إلغاء الباقة دي</button>
      </div>
      <div id="aok" style="margin-top:10px;font-weight:800;color:#22803a"></div>
    </div>

    <div id="p-gen" class="box hide">
      <h2>توليد كود جديد</h2>
      <label>الباقة</label>
      <select id="pkg">
        <option value="term">باقة الترم كامل</option>
        <option value="phys">مراجعة الفيزياء</option>
        <option value="math">الرياضيات</option>
        <option value="arab">ملخصات العربي</option>
      </select>
      <label>اسم مستخدم الطالب (اختياري: لو كتبته الكود يشتغل لحسابه بس)</label>
      <input id="gphone" dir="ltr" autocapitalize="none" placeholder="اسم المستخدم">
      <label>عدد الأكواد</label><input id="gcount" type="number" min="1" max="100" value="1">
      <label>ملاحظة (اختياري)</label><input id="gnote" placeholder="مثلاً: حوّل ٤٩٩ يوم ٣ نوفمبر">
      <button onclick="gen()" style="margin-top:12px">طلّع الكود</button>
      <div id="gerr" class="err"></div>
      <div id="gout"></div>
    </div>

    <div id="p-codes" class="box hide"><h2>آخر الأكواد</h2><div id="clist"></div></div>
    <div id="p-stu" class="box hide"><h2>الطلبة والاشتراكات</h2><div id="slist"></div></div>
  </div>
</div>

<script>
/* الصق نفس القيمتين اللي في index.html */
const SUPABASE_URL='https://lwfifrlpsxfkbfrvknpc.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_s86C5a_hPuw-bsmKlm4NcQ_Hy638TAy';
const PKG={term:'الترم كامل',phys:'الفيزياء',math:'الرياضيات',arab:'العربي'};
const GRADES=[['p1','الصف الأول الابتدائي','الابتدائي'],['p2','الصف الثاني الابتدائي','الابتدائي'],['p3','الصف الثالث الابتدائي','الابتدائي'],['p4','الصف الرابع الابتدائي','الابتدائي'],['p5','الصف الخامس الابتدائي','الابتدائي'],['p6','الصف السادس الابتدائي','الابتدائي'],['e1','الصف الأول الإعدادي','الإعدادي'],['e2','الصف الثاني الإعدادي','الإعدادي'],['e3','الصف الثالث الإعدادي','الإعدادي'],['s1','الصف الأول الثانوي','الثانوي'],['s2','الصف الثاني الثانوي','الثانوي'],['s3','الصف الثالث الثانوي','الثانوي']];
const SUBJ=[['arabic','اللغة العربية'],['math','الرياضيات'],['physics','الفيزياء'],['chem','الكيمياء']];
const GN=Object.fromEntries(GRADES.map(g=>[g[0],g[1]])), SN=Object.fromEntries(SUBJ);
const pkgName=k=>{if(PKG[k])return PKG[k];const [g,sj]=String(k).split(':');return (GN[g]||g)+' - '+(SN[sj]||sj);};
const configured=!/PASTE_/.test(SUPABASE_URL+SUPABASE_ANON_KEY);
const sb=(configured&&window.supabase)?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normUser(u){u=String(u).trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).toLowerCase().replace(/\s+/g,'');if(/^[0-9+]+$/.test(u)){const ph=normPhone(u);if(ph)return ph;}return /^[a-z0-9._]{3,30}$/.test(u)?u:'';}
function normPhone(p){p=String(p).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');if(p.startsWith('0020'))p=p.slice(4);if(p.startsWith('20')&&p.length===12)p='0'+p.slice(2);if(p.length===10&&p[0]==='1')p='0'+p;return /^01[0125]\d{8}$/.test(p)?p:'';}
let lastCodes=[];
const fmt=d=>d?new Date(d).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'}):'';

async function login(){
  $('lerr').textContent='';
  if(!sb){$('lerr').textContent='الصق رابط ومفتاح Supabase في أول الملف';return;}
  const p=normUser($('ph').value);
  if(!p){$('lerr').textContent='اسم المستخدم غير صحيح';return;}
  const r=await sb.auth.signInWithPassword({email:p+'@dars.app',password:$('pw').value});
  if(r.error){$('lerr').textContent='اسم المستخدم أو الباسورد غلط';return;}
  const a=await sb.rpc('is_admin');
  if(a.error||a.data!==true){await sb.auth.signOut();$('lerr').textContent='الحساب ده مش أدمن';return;}
  $('loginBox').classList.add('hide');$('main').classList.remove('hide');loadOrders();
}
function tab(k){
  ['ord','pri','act','gen','codes','stu'].forEach(x=>{$('p-'+x).classList.toggle('hide',x!==k);$('t-'+x).classList.toggle('on',x===k);});
  if(k==='codes')loadCodes(); if(k==='stu')loadStudents(); if(k==='ord')loadOrders(); if(k==='pri')loadPrices();
}
const errMsg=e=>{const m=(e&&e.message)||'';return m.includes('already_decided')?'الطلب ده اتقرر فيه قبل كده':m.includes('not_admin')?'الحساب ده مش أدمن':m||'مشكلة غير معروفة';};
let ORD={};
async function loadOrders(){
  $('olist').textContent='جاري التحميل…';
  const r=await sb.from('orders').select('id,grade,items,total,receipt,status,note,created_at,profiles(name,phone,contact_phone)').order('created_at',{ascending:false}).limit(60);
  if(r.error){$('olist').textContent='مشكلة: '+r.error.message+' (هل شغّلت supabase-update-3.sql؟)';return;}
  ORD={};(r.data||[]).forEach(o=>ORD[o.id]=o);
  const pend=(r.data||[]).filter(o=>o.status==='pending'), done=(r.data||[]).filter(o=>o.status!=='pending').slice(0,15);
  $('ordN').textContent=pend.length?'('+pend.length+')':'';
  $('olist').innerHTML=pend.map(o=>{const pr=o.profiles||{};
    return `<div class="row" id="o${o.id}" style="padding:12px 0">
    <b>${esc(pr.name||'')}</b> • <span dir="ltr">${esc(pr.phone||'')}</span><br>
    ${esc(GN[o.grade]||o.grade)} • ${(o.items||[]).map(x=>esc(SN[x]||x)).join('، ')}<br>
    <span style="font-size:20px;font-weight:900;color:#22803a">${esc(o.total)} ج.م</span> <small>${esc(fmt(o.created_at))}</small>
    <img src="${o.receipt}" alt="إيصال" style="width:100%;max-height:260px;object-fit:contain;background:#f4f6fb;border-radius:12px;margin-top:8px" onclick="showRec(${o.id})">
    <button onclick="approve(${o.id},this)" style="margin-top:10px;background:#22803a;font-size:18px">✅ قبول وتفعيل</button>
    <button class="alt" onclick="this.nextElementSibling.classList.toggle('hide')" style="margin-top:6px">رفض ❌</button>
    <div class="hide"><input id="rn${o.id}" placeholder="سبب الرفض (اختياري)"><button class="alt" onclick="reject(${o.id},this)" style="margin-top:6px">تأكيد الرفض</button></div></div>`;}).join('')||'مفيش طلبات جديدة ✨';
  $('odone').innerHTML=done.map(o=>{const pr=o.profiles||{};return `<div class="row">${o.status==='approved'?'✅':'❌'} <b>${esc(pr.name||'')}</b> • ${esc(GN[o.grade]||o.grade)} • ${esc(o.total)} ج.م ${o.note?'<br><small>'+esc(o.note)+'</small>':''}</div>`;}).join('')||'—';
}
function showRec(id){const o=ORD[id];if(!o)return;let v=$('recv');if(!v){document.body.insertAdjacentHTML('beforeend','<div id="recv" onclick="this.style.display=\'none\'" style="position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:99;overflow:auto;padding:10px"><img style="width:100%"></div>');v=$('recv');}v.firstChild.src=o.receipt;v.style.display='block';}
async function approve(id,b){
  b.disabled=true;const o=ORD[id];
  const r=await sb.rpc('approve_order',{p_id:id});
  if(r.error){b.disabled=false;alert(errMsg(r.error));return;}
  const pr=(o&&o.profiles)||{};const wa=normPhone(pr.contact_phone||pr.phone||'');
  const msg=encodeURIComponent('تم تفعيل اشتراك '+(pr.name||'')+' ✅ ادخل على الموقع وهتلاقي موادك مفتوحة. بالتوفيق!');
  $('o'+id).innerHTML=`<b>✅ اتفعّل لـ ${esc(r.data||pr.name||'')}</b>${wa?`<a class="wa" target="_blank" href="https://wa.me/2${wa.startsWith('0')?wa.slice(1):wa}?text=${msg}">ابعت له رسالة تأكيد على واتساب (اختياري)</a>`:''}`;
  $('ordN').textContent='';
}
async function reject(id,b){
  b.disabled=true;
  const r=await sb.rpc('reject_order',{p_id:id,p_note:$('rn'+id).value});
  if(r.error){b.disabled=false;alert(errMsg(r.error));return;}
  $('o'+id).innerHTML='<b>❌ تم رفض الطلب</b>';
}
async function loadPrices(){
  const [c,t]=await Promise.all([sb.from('catalog').select('grade,subject,price'),sb.from('settings').select('k,v').eq('k','term_end')]);
  if(c.error){$('perr').textContent='مشكلة: '+c.error.message;return;}
  const m={};(c.data||[]).forEach(x=>m[x.grade+'|'+x.subject]=x.price);
  const te=(t.data&&t.data[0]&&t.data[0].v)||'';$('termEnd').value=te?te.slice(0,10):'';
  let h='<div style="overflow-x:auto"><table style="border-collapse:collapse;min-width:100%;font-size:13px"><tr><th style="text-align:right;padding:4px">الصف</th>'+SUBJ.map(s=>`<th style="padding:4px">${s[1]}<br><button class="sm alt" style="font-size:11px;padding:3px 6px" onclick="fillCol('${s[0]}')">نفس السعر للكل</button></th>`).join('')+'</tr>';
  let last='';
  GRADES.forEach(g=>{if(g[2]!==last){last=g[2];h+=`<tr><td colspan="5" style="background:#eef2fa;font-weight:900;padding:6px">${g[2]}</td></tr>`;}
    h+=`<tr><td style="padding:4px;white-space:nowrap">${g[1]}</td>`+SUBJ.map(s=>`<td style="padding:3px"><input data-g="${g[0]}" data-s="${s[0]}" type="number" inputmode="numeric" min="0" placeholder="—" value="${m[g[0]+'|'+s[0]]||''}" style="width:60px;padding:7px 3px;margin:0;font-size:15px"></td>`).join('')+'</tr>';});
  $('pgrid').innerHTML=h+'</table></div>';
}
function fillCol(sj){const v=prompt('اكتب السعر وهيتحط لكل الصفوف (اللي مش عايزهم امسحهم بعدين):');if(v===null)return;document.querySelectorAll(`#pgrid input[data-s="${sj}"]`).forEach(i=>i.value=v.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)));}
async function savePrices(){
  $('perr').textContent='';$('pok').textContent='';
  const rows=[...document.querySelectorAll('#pgrid input')].map(i=>({grade:i.dataset.g,subject:i.dataset.s,price:parseInt(i.value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)),10)||0}));
  const r=await sb.rpc('admin_set_prices',{p_rows:rows});
  if(r.error){$('perr').textContent=errMsg(r.error);return;}
  const t=await sb.rpc('admin_set_setting',{p_k:'term_end',p_v:$('termEnd').value?($('termEnd').value+'T23:59:59+02:00'):''});
  if(t.error){$('perr').textContent=errMsg(t.error);return;}
  $('pok').textContent='تم الحفظ ✅';
}
function copy(t,btn){try{navigator.clipboard.writeText(t);}catch(e){} if(btn){const o=btn.textContent;btn.textContent='تم';setTimeout(()=>btn.textContent=o,1200);}}
let aStu=null;
async function findStu(){
  $('aerr').textContent='';$('aok').textContent='';$('astu').classList.add('hide');aStu=null;
  const p=normUser($('aphone').value);
  if(!p){$('aerr').textContent='اسم مستخدم غير صحيح';return;}
  const r=await sb.from('profiles').select('name,phone,grade,contact_phone,subscriptions(package)').eq('phone',p).maybeSingle();
  if(r.error){$('aerr').textContent='مشكلة: '+r.error.message;return;}
  if(!r.data){$('aerr').textContent='مفيش طالب مسجّل باسم المستخدم ده. لازم يعمل حساب الأول.';return;}
  aStu=r.data;
  $('ainfo').innerHTML='<span><b>'+esc(r.data.name)+'</b> • <span dir="ltr">'+esc(r.data.phone)+'</span></span><span>واتساب: <span dir="ltr">'+esc(r.data.contact_phone||'—')+'</span></span><span>'+esc(r.data.grade)+'</span><span>الاشتراكات: '+((r.data.subscriptions||[]).length?r.data.subscriptions.map(x=>esc(PKG[x.package]||x.package)).join('، '):'مفيش')+'</span>';
  $('astu').classList.remove('hide');
}
async function act(){
  if(!aStu)return; $('aerr').textContent='';$('aok').textContent='';
  const r=await sb.rpc('admin_activate',{p_phone:aStu.phone,p_package:$('apkg').value});
  if(r.error){$('aerr').textContent='حصلت مشكلة: '+r.error.message;return;}
  $('aok').textContent='تم تفعيل '+PKG[$('apkg').value]+' لـ '+r.data+' ✅';
  findStuKeep();
}
async function rev(){
  if(!aStu)return; if(!confirm('تلغي الباقة دي لـ '+aStu.name+'؟'))return;
  $('aerr').textContent='';$('aok').textContent='';
  const r=await sb.rpc('admin_revoke',{p_phone:aStu.phone,p_package:$('apkg').value});
  if(r.error){$('aerr').textContent='حصلت مشكلة: '+r.error.message;return;}
  $('aok').textContent='تم إلغاء '+PKG[$('apkg').value]+' لـ '+r.data;
  findStuKeep();
}
async function findStuKeep(){const m=$('aok').textContent; await findStu(); $('aok').textContent=m;}
async function gen(){
  $('gerr').textContent='';$('gout').innerHTML='';
  const ph=$('gphone').value.trim(), phone=ph?normUser(ph):'';
  if(ph&&!phone){$('gerr').textContent='اسم مستخدم الطالب غير صحيح';return;}
  const n=parseInt($('gcount').value,10)||1;
  const r=await sb.rpc('admin_generate_codes',{p_package:$('pkg').value,p_count:n,p_phone:phone||null,p_note:$('gnote').value||null});
  if(r.error){$('gerr').textContent='حصلت مشكلة: '+r.error.message;return;}
  const codes=r.data||[]; lastCodes=codes;
  let wa=''; if(phone){const q=await sb.from('profiles').select('contact_phone').eq('phone',phone).maybeSingle(); wa=(q.data&&q.data.contact_phone)||(/^01[0125]\d{8}$/.test(phone)?phone:'');}
  $('gout').innerHTML=codes.map(c=>`<div class="code"><span>${esc(c)}</span><button class="sm" onclick="copy('${esc(c)}',this)">نسخ</button></div>`).join('')
    +(codes.length>1?`<button class="alt" style="margin-top:8px" onclick="copy(lastCodes.join('\\n'),this)">نسخ الكل</button>`:'')
    +(wa&&codes.length===1?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/2${wa}?text=${encodeURIComponent('تم استلام الدفع ✅ كود التفعيل بتاعك: '+codes[0]+'\nادخله من المتجر ← اشترك ← خانة الكود. الكود بيشتغل مرة واحدة بس.')}">📲 ابعته للطالب على واتساب</a>`:'');
}
async function loadCodes(){
  const r=await sb.from('codes').select('code,package,student_phone,note,created_at,used_at,profiles:used_by(name,phone)').order('created_at',{ascending:false}).limit(200);
  if(r.error){$('clist').textContent='مشكلة: '+r.error.message;return;}
  $('clist').innerHTML=(r.data||[]).map(c=>`<div class="row"><b>${esc(c.code)}</b>
    <span class="tag ${c.used_at?'used':'free'}">${c.used_at?'مستخدم':'متاح'}</span><br>
    ${esc(PKG[c.package]||c.package)}${c.student_phone?' • للرقم '+esc(c.student_phone):''}${c.note?' • '+esc(c.note):''}<br>
    <small>${c.used_at?'استخدمه '+esc(c.profiles&&c.profiles.name||'')+' '+esc(c.profiles&&c.profiles.phone||'')+' • '+fmt(c.used_at):'اتولّد '+fmt(c.created_at)}</small></div>`).join('')||'مفيش أكواد لسه';
}
async function loadStudents(){
  const r=await sb.from('profiles').select('name,phone,grade,contact_phone,created_at,subscriptions(package)').order('created_at',{ascending:false}).limit(300);
  if(r.error){$('slist').textContent='مشكلة: '+r.error.message;return;}
  $('slist').innerHTML=(r.data||[]).map(s=>`<div class="row"><b>${esc(s.name)}</b> • <span dir="ltr">${esc(s.phone)}</span> • واتساب <span dir="ltr">${esc(s.contact_phone||'—')}</span><br>
    ${esc(s.grade)}<br><small>${(s.subscriptions||[]).length?'مشترك في: '+s.subscriptions.map(x=>esc(pkgName(x.package))).join('، '):'مفيش اشتراكات'}</small></div>`).join('')||'مفيش طلبة لسه';
}
</script>
